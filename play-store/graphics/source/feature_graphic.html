<!doctype html>
<!-- Play Store feature graphic, 1024x500. Rendered by render.py.
     Keep key text away from the edges: Play may crop or overlay a play button in some layouts. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{font-family:"Segoe UI","Roboto","Noto Sans",Arial,sans-serif;color:#F2F4F7;
       background:radial-gradient(circle at 78% 30%,rgba(61,139,253,.38),rgba(61,139,253,0) 46%),
                  linear-gradient(135deg,#0F1114 0%,#121A2B 45%,#17325A 100%);}
  .wrap{position:absolute;inset:0;padding:0 64px;display:flex;align-items:center}
  .left{width:520px}
  .brand{display:flex;align-items:center;gap:20px}
  .brand img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  h1{margin:0;font-size:70px;font-weight:800;letter-spacing:-1px;line-height:1}
  .tag{margin:18px 0 0;font-size:30px;font-weight:600;color:#9CC6FF}
  .chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;max-width:290px}
  .chip{font-size:17px;font-weight:600;padding:8px 14px;border-radius:6px;
        background:rgba(61,139,253,.16);border:1px solid rgba(61,139,253,.45);color:#D5E5FF}
  .phone{position:absolute;right:70px;top:46px;width:250px;height:520px;border-radius:38px;
         background:#05070A;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 2px #2A2F36;transform:rotate(6deg)}
  .screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#0F1114}
  .screen img{width:100%;display:block}
  .phone2{position:absolute;right:300px;top:96px;width:210px;height:440px;border-radius:32px;background:#05070A;padding:9px;
          box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 0 2px #2A2F36;transform:rotate(-7deg);opacity:.92}
  .phone2 .screen{border-radius:25px}
</style></head>
<body>
  <div class="phone2"><div class="screen"><img src="shots/studio_create.png"></div></div>
  <div class="phone"><div class="screen"><img src="shots/studio_top.png"></div></div>
  <div class="wrap">
    <div class="left">
      <div class="brand"><img src="../icon/icon_512.png"><h1>Gallerai</h1></div>
      <p class="tag">Photos, Video &amp; AI</p>
      <div class="chips">
        <span class="chip">AI Cutout</span><span class="chip">Copy text</span>
        <span class="chip">Clean up</span><span class="chip">Photo lock</span>
      </div>
    </div>
  </div>
</body></html>
